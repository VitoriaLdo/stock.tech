<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimentações · Stock.tech</title>
    <!-- FONTES -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- ÍCONES -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/menu-lateral.css">
    <link rel="stylesheet" href="assets/css/movimentacoes.css">
</head>

<body>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- MENU -->
    <nav class="sidebar" id="sidebar">
        <div class="logo">
            <i class="fa-solid fa-box-archive"></i>
            <h2 class="logo-text">Stock<span>.tech</span></h2>
        </div>

        <div class="menu-container">
            <div class="categoria">
                <p class="titulo-categoria">Visão Geral</p>
                <ul>
                    <li>
                        <a href="index.html">
                            <i class="fa-solid fa-chart-line"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>

                    <li>
                        <a href="financeiro.html">
                            <i class="fa-solid fa-money-bill-wave"></i>
                            <span>Financeiro</span>
                        </a>
                    </li>
                </ul>
            </div>

            <div class="categoria">
                <p class="titulo-categoria">Estoque</p>
                <ul>
                    <li>
                        <a href="movimentacoes.html" class="active">
                            <i class="fa-solid fa-truck-ramp-box"></i>
                            <span>Movimentações</span>
                        </a>
                    </li>

                    <li>
                        <a href="produtos.html">
                            <i class="fa-solid fa-box-open"></i>
                            <span>Produtos</span>
                        </a>
                    </li>
                </ul>
            </div>

            <div class="categoria">
                <p class="titulo-categoria">Comercial</p>
                <ul>
                    <li>
                        <a href="pedidos.html">
                            <i class="fa-solid fa-cart-shopping"></i>
                            <span>Pedido de Vendas</span>
                        </a>
                    </li>

                    <li>
                        <a href="contatos.html">
                            <i class="fa-solid fa-address-book"></i>
                            <span>Contatos</span>
                        </a>
                    </li>
                </ul>
            </div>

            <div class="categoria">
                <p class="titulo-categoria">Ajuda</p>
                <ul>
                    <li>
                        <a href="faq.html">
                            <i class="fa-solid fa-circle-question"></i>
                            <span>FAQ</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <div class="sidebar-footer">
            <a href="login.html" class="btn-sair">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Desconectar</span>
            </a>
        </div>
    </nav>

    <!-- CONTEÚDO -->
    <div class="main-wrapper">
        <!-- TOPBAR -->
        <header class="topbar">
            <div class="topbar-left">
                <h2 class="topbar-title">Movimentações</h2>
            </div>

            <div class="topbar-right">
                <div class="nav-item">
                    <button class="icon-btn" id="btn-config">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>

                <div class="nav-item has-dropdown user-chip-wrap">
                    <div class="user-chip">
                        <div class="chip-avatar" id="nav-avatar">VI</div>
                        <span class="chip-name" id="nav-name">Vitória</span>
                    </div>

                    <div class="dropdown-menu profile-menu">
                        <div class="profile-header">
                            <strong id="drop-name">Vitória Letícia</strong>
                            <small id="drop-email">vitoria@stocktech.com</small>
                        </div>

                        <div class="profile-body">
                            <p id="drop-cargo">Analista de Estoque</p>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <!-- PÁGINA -->
        <main class="page-content">
            <section class="movimentacoes-container">
                <div class="topo-movimentacoes">
                    <div class="acoes-topo">

                        <div class="search-box">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text"
                                id="pesquisa"
                                placeholder="Pesquisar movimentações">
                        </div>

                        <select id="filtroTipo">
                            <option value="todos">Todos os tipos</option>
                            <option value="entrada">Entrada</option>
                            <option value="venda">Venda</option>
                            <option value="devolucao">Devolução</option>
                        </select>

                        <button class="btn btn-green">+ Movimentação</button>
                        <button class="btn btn-outline">Filtrar</button>
                        <button class="btn btn-light" id="btnLimpar">Limpar</button>
                    </div>
                </div>

                <div class="cards-movimentacoes" id="cardsContainer"></div>
            </section>
        </main>
    </div>
    <!-- MODAL -->
    <div class="modal-overlay" id="modal-config">
        <div class="modal-box modal-lg">
            <div class="modal-head">
                <h3>Configurações</h3>

                <button class="modal-close" id="btn-fechar-config">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="config-layout">
                <div class="config-nav">
                    <button class="config-tab active" data-tab="tab-perfil">Meu Perfil</button>
                    <button class="config-tab" data-tab="tab-aparencia">Aparência</button>
                </div>

                <div class="config-content">
                    <div id="tab-perfil" class="config-pane active">
                        <div class="form-group">
                            <label class="form-label">Nome Completo</label>
                            <input type="text" class="form-control" id="cfg-nome">
                        </div>

                        <div class="form-group">
                            <label class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="cfg-email">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Cargo</label>
                            <input type="text" class="form-control" id="cfg-cargo">
                        </div>
                    </div>

                    <div id="tab-aparencia" class="config-pane" style="display: none;">
                        <div class="form-group">
                            <label class="form-label">Tema da Interface</label>

                            <select class="form-control" id="cfg-tema">
                                <option value="light">Claro</option>
                                <option value="dark">Escuro</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-foot">
                <button class="btn-ghost" id="btn-cancelar-config"> Cancelar</button>
                <button class="btn-primary" id="btn-salvar-config">Salvar Mudanças</button>
            </div>
        </div>
    </div>
    <!-- TOAST -->
    <div class="toast-container" id="toast-container"></div>
    <!-- JS -->
    <script src="assets/js/menu-lateral.js"></script>
    <script src="assets/js/movimentacoes.js"></script>
</body>

</html>
