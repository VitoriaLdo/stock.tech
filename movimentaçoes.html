<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimentações</title>

    <!-- FONTES -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- ÍCONES -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS --> 
    <link rel="stylesheet" href="menu-lateral.css">
    <link rel="stylesheet" href="movimentacoes.css">
</head>

<body>
    <!-- MENU LATERAL PADRÃO -->
    <nav class="sidebar">
        <div class="logo">
            <i class="fa-solid fa-box-archive"></i>
            <h2 class="logo-text">Stock<span>.tech</span></h2>
        </div>

        <div class="menu-container">
            <div class="categoria">
                <p class="titulo-categoria">Visão Geral</p>
                <ul>
                    <li><a href="#"><i class="fa-solid fa-chart-line"></i> <span>Dashboard</span></a></li>
                    <li><a href="#"><i class="fa-solid fa-money-bill-wave"></i> <span>Financeiro</span></a></li>
                </ul>
            </div>

            <div class="categoria">
                <p class="titulo-categoria">Estoque</p>
                <ul>
                    <li><a href="#"><i class="fa-solid fa-truck-ramp-box"></i> <span>Movimentações</span></a></li>
                    <li><a href="#"><i class="fa-solid fa-box-open"></i> <span>Produtos</span></a></li>
                </ul>
            </div>

            <div class="categoria">
                <p class="titulo-categoria">Comercial</p>
                <ul>
                    <li><a href="#"><i class="fa-solid fa-cart-shopping"></i> <span>Pedido de Vendas</span></a></li>
                    <li><a href="#"><i class="fa-solid fa-address-book"></i> <span>Contatos</span></a></li>
                </ul>
            </div>

            <div class="categoria">
                <p class="titulo-categoria">Suporte</p>
                <ul>
                    <li><a href="#"><i class="fa-solid fa-circle-question"></i> <span>FAQ</span></a></li>
                </ul>
            </div>
        </div>

        <div class="sidebar-footer">
            <a href="#" class="btn-sair">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Desconectar</span>
            </a>
        </div>
    </nav>

    <!-- TELA DA VITÓRIA - MOVIMENTAÇÕES -->
    <main class="content">
        <section class="page-body">
            <!-- TOPO -->
            <div class="topo-movimentacoes">
                <h1>Movimentações</h1>

                <div class="acoes-topo">

                    <!-- PESQUISA -->
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="pesquisa" placeholder="Pesquisar movimentações">
                    </div>

                    <!-- FILTROS -->
                    <select id="filtroTipo">
                        <option value="todos">Todos os tipos</option>
                        <option value="entrada">Entrada</option>
                        <option value="venda">Venda</option>
                        <option value="devolucao">Devolução</option>
                    </select>

                    <!-- BOTÕES -->
                    <button class="btn btn-green">+ Movimentação</button>
                    <button class="btn btn-outline">Filtrar</button>
                    <button class="btn btn-light" id="btnLimpar">Limpar</button>
                </div>

            </div>

            <!-- LISTA DE MOVIMENTAÇÕES -->
            <div class="cards-movimentacoes" id="cardsContainer"></div>
        </section>

    </main>

    <script src="movimentacoes.js"></script>

</body>

</html>
